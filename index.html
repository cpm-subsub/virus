<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウイルスが検出されました</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="warning-box">
        <h1>⚠ 警告</h1>
        <p>あなたのAndroidデバイスはウイルスに感染している可能性があります</p>
        <p>今すぐスキャンしてクリーンナップしてください！</p>
        <button onclick="fakeScan()">ウイルスを削除</button>
    </div>
    <script>
        function fakeScan() {
            alert('スキャンを開始します…');
            setTimeout(() => {
                alert('ウイルスを検出しました');
                setTimeout(() => {
                    alert('今すぐクリーンナップしてください');
                }, 2000);
            }, 2000);
        }
    </script>
</body>
</html>
